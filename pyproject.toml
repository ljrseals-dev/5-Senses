[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "body-of-secrets"
version = "0.1.0"
description = "Classical Intelligence & Language Architecture — private, local-first knowledge engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "BODY OF SECRETS contributors" }
]
keywords = [
    "classical-ai",
    "expert-system",
    "associative-memory",
    "local-first",
    "provenance",
    "neural-networks",
    "1980s-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
all = [
    "body-of-secrets[openai,anthropic,dev]",
]

[project.scripts]
body-of-secrets = "body_of_secrets.interface.cli:main"
body-of-secrets-music = "body_of_secrets.music.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["body_of_secrets*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
