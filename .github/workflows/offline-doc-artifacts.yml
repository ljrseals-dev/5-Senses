name: Offline document MCP artifact integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, integrate-offline-doc-mcp]

permissions:
  contents: read

jobs:
  verify-audited-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Verify pinned artifact identities and ZIP structure
        run: bash scripts/verify_refactored_spoon_artifacts.sh
