name: Python tests and lint
on:
  push:
    branches: [main, "fix/**", "boy-scout/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q
      - name: Lint changed Python files
        shell: bash
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- '*.py')"
          if [[ -z "$changed" ]]; then
            echo "No changed Python files."
          else
            while IFS= read -r file; do
              python -m ruff check "$file"
            done <<< "$changed"
          fi
