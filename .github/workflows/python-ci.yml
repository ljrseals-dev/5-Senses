name: Python CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/symbolic-music-learning"]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests and lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile package
        run: python -m compileall -q body_of_secrets
      - name: Smoke-test installed CLI entry points
        run: |
          body-of-secrets --version
          body-of-secrets-music --help
          body-of-secrets music encode --help
      - name: Run regression tests
        run: python -m pytest -q
      - name: Lint changed Python areas
        run: ruff check body_of_secrets/music body_of_secrets/language/ngram.py body_of_secrets/interface/cli.py tests/test_music.py
      - name: Type-check music implementation
        run: mypy --disable-error-code no-untyped-def --follow-imports=silent body_of_secrets/music body_of_secrets/language/ngram.py
